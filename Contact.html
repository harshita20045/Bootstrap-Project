<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - StudySpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="Main.css"/>
  <style>
    body {
      background-color: #f8f9fa;
    }

    .contact-container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 3rem;
      margin-bottom: 3rem;
    }

    @media (max-width: 576px) {
      .contact-container {
        padding: 1.5rem;
        margin: 1.5rem 1rem;
      }
    }

    .contact-title {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    footer {
      position: relative;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>

  
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">StudySpace</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="Main.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="About.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="Services.html">Services</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Profile</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="Profile.html">Your Profile</a></li>
              <li><a class="dropdown-item" href="login.html">Log In</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="Welcome.html">Log Out</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search topics">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="contact-container mx-auto">
      <h2 class="contact-title">Contact Us</h2>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="userName" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="userName" required>
          </div>
          <div class="col-md-6">
            <label for="userEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="userEmail" required>
          </div>
        </div>
        <div class="mb-3 mt-3">
          <label for="subject" class="form-label">Subject</label>
          <input type="text" class="form-control" id="subject" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="5" required></textarea>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-5">Send</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    &copy; 2025 StudySpace | All Rights Reserved
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
