<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Profile - StudySpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="Main.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .profile-card {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .profile-card:hover {
      transform: scale(1.02);
    }

    .profile-image {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .social-icons a {
      text-decoration: none;
      margin: 0 10px;
      font-size: 20px;
      color: #333;
    }

    .social-icons a:hover {
      color: #0d6efd;
    }

    .contact-btn {
      background-color: #0d6efd;
      color: #fff;
      padding: 10px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      margin-top: 20px;
    }

    .contact-btn:hover {
      background-color: #0b5ed7;
    }

    @media (max-width: 576px) {
      .profile-card {
        margin: 20px;
        padding: 25px 20px;
      }

      .contact-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">StudySpace</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="Main.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="About.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="Services.html">Services</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Profile</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="Profile.html">Your Profile</a></li>
              <li><a class="dropdown-item" href="login.html">Log In</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="Welcome.html">Log Out</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search topics">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>


<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="profile-card">
        <img src="https://via.placeholder.com/130" alt="Profile Photo" class="profile-image">
        <h2>Harshita Baghel</h2>
        <p class="text-muted mb-1">Student & Developer</p>
        <p class="text-secondary">Chameli Devi Group of Institutions</p>

        <div class="social-icons my-3">
          <a href="#"><i class="fa fa-dribbble"></i></a>
          <a href="#"><i class="fa fa-twitter"></i></a>
          <a href="#"><i class="fa fa-linkedin"></i></a>
          <a href="#"><i class="fa fa-facebook"></i></a>
        </div>

        <button class="contact-btn">Contact</button>
      </div>
    </div>
  </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
