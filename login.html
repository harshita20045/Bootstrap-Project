<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <video autoplay muted loop class="bg-video">
    <source src="./video/istockphoto-623410126-640_adpp_is.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <div class="container">
    <form action="Main.html">
      <h2 class="text-center mb-4">Login Page</h2>

      <div class="mb-3">
        <label for="inputEmail3" class="form-label">Email</label>
        <input type="email" class="form-control" id="inputEmail3" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label for="inputPassword3" class="form-label">Password</label>
        <input type="password" class="form-control" id="inputPassword3" placeholder="Enter password">
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Qualification:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="student" value="student" checked>
          <label class="form-check-label" for="student">Student</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="employee" value="employee">
          <label class="form-check-label" for="employee">Employee</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="trainer" value="trainer">
          <label class="form-check-label" for="trainer">Trainer</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="other" value="other">
          <label class="form-check-label" for="other">Other</label>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remind me</label>
      </div>

      <button  type="submit" class="btn btn-primary w-100" >Sign in</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
