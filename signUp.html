<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <video autoplay muted loop class="bg-video">
    <source src="./video/istockphoto-623410126-640_adpp_is.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <div class="container mt-5">
    <form>
      <h2 class="text-center mb-4 text-white">Sign Up</h2>

 
      <div class="mb-3">
        <label for="fullName" class="form-label text-white">Full Name</label>
        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
      </div>

   
      <div class="mb-3">
        <label for="inputEmail3" class="form-label text-white">Email</label>
        <input type="email" class="form-control" id="inputEmail3" placeholder="Enter your email" required>
      </div>

   
      <div class="mb-3">
        <label for="inputPassword3" class="form-label text-white">Password</label>
        <input type="password" class="form-control" id="inputPassword3" placeholder="Create a password" required>
      </div>

   
      <div class="mb-3">
        <label for="confirmPassword" class="form-label text-white">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required>
      </div>

   
      <div class="mb-3">
        <label class="form-label text-white d-block">Qualification:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="student" value="student" checked>
          <label class="form-check-label text-white" for="student">Student</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="employee" value="employee">
          <label class="form-check-label text-white" for="employee">Employee</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="trainer" value="trainer">
          <label class="form-check-label text-white" for="trainer">Trainer</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="qualification" id="other" value="other">
          <label class="form-check-label text-white" for="other">Other</label>
        </div>
      </div>

    
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remindMe" required>
        <label class="form-check-label text-white" for="remindMe">
          I agree to the terms and conditions
        </label>
      </div>

      
      <button type="submit" class="btn btn-primary w-100">Sign Up</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
